<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billing Assistant</title>
<style>
  :root { --bg:#f4f6f8; --panel:#fff; --ink:#1d2733; --muted:#5f6b7a; --accent:#126b6f; --user:#e7eefb;
          --bot:#e8f5f2; --line:#dde3ea; --err:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--accent); color:#fff; padding:12px 20px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:18px; margin:0; }
  main { display:grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap:16px; padding:16px; max-width:1300px; margin:auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; min-height:200px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 0 12px; }
  #messages { display:flex; flex-direction:column; gap:10px; max-height:60vh; overflow:auto; margin-bottom:12px; }
  .msg { padding:10px 12px; border-radius:8px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .msg.bot { white-space:normal; }
  code { background:#f1f3f5; padding:0 4px; border-radius:3px; }
  .user { background:var(--user); align-self:flex-end; max-width:85%; }
  .bot { background:var(--bot); align-self:flex-start; max-width:95%; }
  .error { color:var(--err); }
  form { display:flex; gap:8px; }
  input { flex:1; padding:9px 10px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  button { padding:9px 14px; border:0; border-radius:6px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button.secondary { background:#6b7785; }
  button:disabled { opacity:.5; cursor:default; }
  .confirm { border:2px solid var(--accent); border-radius:8px; padding:12px; margin:6px 0; background:#fff; }
  .confirm table td { padding:2px 10px 2px 0; }
  .step { border-left:4px solid var(--line); padding:6px 10px; margin-bottom:8px; font-size:13px; }
  .step.llm { border-color:#7b61c2; } .step.mcp { border-color:#1b998b; } .step.rest { border-color:#d98c1c; }
  .step.confirmation { border-color:#126b6f; } .step.err { border-color:var(--err); }
  .step b { display:inline-block; min-width:110px; }
  pre { margin:4px 0 0; white-space:pre-wrap; word-break:break-word; background:#f7f8fa; padding:6px; border-radius:4px; max-height:220px; overflow:auto; }
  #login { max-width:380px; margin:60px auto; }
  #login form { flex-direction:column; }
  .hint { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<header><h1>Mobile Provider Billing Assistant</h1><span id="who"></span></header>

<section id="login">
  <h2>Sign in</h2>
  <form id="loginForm">
    <input id="username" placeholder="Subscriber number" autocomplete="username" required>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <div id="loginError" class="error"></div>
  </form>
</section>

<main id="app" hidden>
  <section>
    <h2>Chat</h2>
    <div id="messages"></div>
    <form id="chatForm">
      <input id="question" placeholder="e.g. Why is my October bill higher?" maxlength="1000" autocomplete="off" required>
      <button type="submit" id="send">Send</button>
    </form>
    <p class="hint">Try: "How much does extra internet cost?" · "What is my October bill?" ·
      "Why is my October bill higher?" · "Pay my October bill"</p>
  </section>
  <section>
    <h2>Agent tool trace (last request)</h2>
    <div id="trace" class="hint">Tool calls appear here.</div>
  </section>
</main>

<script>
const API = location.pathname.startsWith("/agent") ? "/agent/v1" : "v1";
let token = null, conversationId = null;
const $ = (id) => document.getElementById(id);

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

// Minimal, safe markdown for model answers: everything is HTML-escaped first, then only
// **bold**, `code`, ### headings and "* " / "- " bullets are turned into markup.
function renderMarkdown(text) {
  const esc = String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  return esc.split("\n").map(line => {
    let l = line.replace(/^#{1,6}\s+(.*)$/, "<strong>$1</strong>")
                .replace(/^(\s*)[*-]\s+/, "$1&bull; ")
                .replace(/^-{3,}$/, "");
    return l.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>");
  }).join("<br>");
}
function setAnswer(node, text) { node.innerHTML = renderMarkdown(text); }
function addMessage(text, who, markdown = false) {
  const m = el("div", "msg " + who); markdown ? setAnswer(m, text) : (m.textContent = text);
  $("messages").append(m); m.scrollIntoView(); return m;
}

async function call(path, body) {
  const headers = {"Content-Type": "application/json"};
  if (token) headers.Authorization = "Bearer " + token;
  const res = await fetch(API + path, {method: "POST", headers, body: JSON.stringify(body)});
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || data.message || ("HTTP " + res.status));
  return data;
}

function renderTrace(steps) {
  const box = $("trace"); box.replaceChildren();
  if (!steps || !steps.length) { box.textContent = "No tool calls."; return; }
  for (const s of steps) {
    const d = el("div", "step " + s.kind + (s.status === "error" ? " err" : ""));
    const label = {llm: "LLM", mcp: "MCP", rest: "REST via Gateway", confirmation: "User action", agent: "Agent"}[s.kind] || s.kind;
    d.append(el("b", null, label), el("span", null, ` ${s.name} · ${s.status} · ${s.latency_ms} ms`));
    if (s.input && Object.keys(s.input).length) d.append(el("pre", null, "input: " + JSON.stringify(s.input, null, 1)));
    if (s.http && s.http.length) d.append(el("pre", null, s.http.map(h => `${h.method} ${h.path} -> ${h.status}`).join("\n")));
    d.append(el("pre", null, "result: " + JSON.stringify(s.output, null, 1)));
    box.append(d);
  }
}

const cards = new Map();  // paymentIntentId -> card element (each request is shown once)

function closeCard(id, note) {
  const card = cards.get(id); if (!card || card.dataset.closed) return;
  card.dataset.closed = "1";
  card.querySelectorAll("button").forEach(b => b.disabled = true);
  card.append(el("div", "hint", note));
}

function renderPending(p) {
  if (cards.has(p.paymentIntentId)) return;               // still the same pending request
  for (const id of cards.keys()) closeCard(id, "Replaced by a newer payment request.");
  const card = el("div", "confirm");
  cards.set(p.paymentIntentId, card);
  card.append(el("strong", null, "Payment confirmation required"));
  const t = el("table");
  for (const [k, v] of [["Subscriber", p.subscriberNo], ["Billing period", p.period], ["Amount", "$" + p.amount.toFixed(2)],
                        ["Current remaining balance", "$" + p.currentRemainingBalance.toFixed(2)]]) {
    const r = el("tr"); r.append(el("td", null, k), el("td", null, v)); t.append(r);
  }
  const ok = el("button", null, "Confirm payment"), no = el("button", "secondary", "Cancel");
  const act = async (action) => {
    ok.disabled = no.disabled = true;
    try { const r = await call(`/payments/${encodeURIComponent(p.paymentIntentId)}/${action}`, {conversationId});
          closeCard(p.paymentIntentId, action === "confirm" ? "Confirmed." : "Cancelled.");
          addMessage(r.answer, "bot", true); renderTrace(r.trace); }
    catch (e) { closeCard(p.paymentIntentId, "Not available: " + e.message); addMessage(e.message, "bot error"); }
  };
  ok.onclick = () => act("confirm"); no.onclick = () => act("cancel");
  card.append(t, ok, document.createTextNode(" "), no);
  $("messages").append(card); card.scrollIntoView();
}

$("loginForm").onsubmit = async (ev) => {
  ev.preventDefault(); $("loginError").textContent = "";
  try {
    const r = await call("/auth/login", {username: $("username").value.trim(), password: $("password").value});
    token = r.accessToken; $("password").value = "";
    $("who").textContent = "Signed in as " + r.username;
    $("login").hidden = true; $("app").hidden = false; $("question").focus();
  } catch (e) { $("loginError").textContent = e.message; }
};

$("chatForm").onsubmit = async (ev) => {
  ev.preventDefault();
  const q = $("question").value.trim(); if (!q) return;
  $("question").value = ""; $("send").disabled = true;
  addMessage(q, "user"); const wait = addMessage("Thinking...", "bot");
  try {
    const r = await call("/chat", {message: q, conversationId});
    conversationId = r.conversationId; setAnswer(wait, r.answer); renderTrace(r.trace);
    if (r.pendingPayment) renderPending(r.pendingPayment);
  } catch (e) { wait.textContent = e.message; wait.classList.add("error"); }
  finally { $("send").disabled = false; $("question").focus(); }
};
</script>
</body>
</html>
